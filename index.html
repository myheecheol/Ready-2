<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 무역 분석가</title>
<meta name="description" content="비상 사회 6-2 「③ 세계의 무역」 12~16차시 데이터 분석형 AI 융합수업용 웹앱">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&display=swap">
<style>
:root{
  --blue:#2F5BAF; --blue-d:#244a90; --blue-l:#DFE6F4; --blue-ll:#F2F5FB;
  --bg:#E9EDF4; --title:#222222; --text:#4D4D4D; --card:#FFFFFF; --warn:#C0392B;
  --line:#D3DAE6; --muted:#7A8394; --grey:#B5BCC8; --grey-l:#EEF0F4; --ok:#2E7D4F; --ok-l:#E7F3EC;
  --font:"Pretendard","Pretendard Variable","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","맑은 고딕",sans-serif;
}
*{box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%}
html.present{font-size:22.4px}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:1.25rem;line-height:1.55;overflow-x:hidden;word-break:keep-all;overflow-wrap:anywhere}
h1,h2,h3,h4{color:var(--title);margin:0;line-height:1.3}
p{margin:.35em 0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.ic{flex:none;vertical-align:middle}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}
html.present .wrap{max-width:1840px}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* 상단 바 */
.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:8px;min-height:56px}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto;min-width:0;color:var(--title);font-weight:800;font-size:1.2rem;text-decoration:none;background:none;border:0;cursor:pointer;padding:0;min-height:44px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--blue);color:#fff;display:inline-flex;align-items:center;justify-content:center;flex:none}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-btn{min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;border:1px solid var(--line);background:#fff;border-radius:10px;color:var(--title);cursor:pointer;font-size:1rem;white-space:nowrap}
.tb-btn:hover{border-color:var(--blue)}
.tb-btn.on{background:var(--blue);color:#fff;border-color:var(--blue)}
@media (max-width:760px){.tb-btn .lbl{display:none}.tb-btn{padding:0 10px}}
html.present .topbar{display:none}
.present-bar{display:none;position:fixed;left:12px;bottom:12px;z-index:30;gap:6px}
html.present body{padding-bottom:64px}
html.present .present-bar{display:flex}
.present-bar .tb-btn{font-size:.8rem}

/* 공통 요소 */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 18px;border-radius:10px;border:1px solid var(--blue);background:var(--blue);color:#fff;font-weight:700;cursor:pointer;text-decoration:none;font-size:1.05rem;line-height:1.25;text-align:center}
.btn:hover{background:var(--blue-d)}
.btn.ghost{background:#fff;color:var(--blue)}
.btn.ghost:hover{background:var(--blue-ll)}
.btn.plain{background:#fff;color:var(--title);border-color:var(--line);font-weight:600}
.btn.plain:hover{border-color:var(--blue)}
.btn.warn{background:#fff;color:var(--warn);border-color:var(--warn)}
.btn:disabled,.btn.disabled{background:#D7DBE2;border-color:#D7DBE2;color:#6F7686;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:1rem}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.link-wrap{display:inline-flex;flex-direction:column;gap:2px}
.nolink{font-size:.9rem;color:var(--muted)}
input[type=text],input[type=number],input[type=url],input[type=password],select,textarea{min-height:44px;border:1px solid var(--line);border-radius:10px;padding:6px 12px;background:#fff;font-size:1.1rem;max-width:100%}
textarea{width:100%;min-height:88px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid rgba(47,91,175,.35);outline-offset:1px;border-color:var(--blue)}
input.fill{width:9em;text-align:center;font-weight:700}
input.num{width:7em;text-align:right}
label.field{display:flex;flex-direction:column;gap:4px;font-weight:600;color:var(--title);font-size:1.05rem}
.note{font-size:1rem;color:var(--muted)}
.small{font-size:.9rem;color:var(--muted)}
.lead{font-size:1.4rem;color:var(--title);font-weight:700}
.big-q{font-size:1.5rem;color:var(--title);font-weight:800;line-height:1.4}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:.9rem;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--grey-l);color:var(--text);border:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.badge.ex{background:#fff;color:var(--warn);border-color:var(--warn)}
.badge.blue{background:var(--blue);color:#fff;border-color:var(--blue)}
.badge.done{background:var(--blue-l);color:var(--blue);border-color:var(--blue-l)}
.callout{border-left:5px solid var(--blue);background:var(--blue-ll);padding:12px 16px;border-radius:0 12px 12px 0;color:var(--title);margin:10px 0}
.callout.warn{border-color:var(--warn);background:#FBF0EE}
.quote{border:1px solid var(--line);background:#FAFBFD;border-radius:12px;padding:12px 16px;color:var(--title);margin:10px 0}
.quote .src{display:block;font-size:.9rem;color:var(--muted);margin-top:4px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:900px){.grid3,.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}
.mini{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}
.mini h3{font-size:1.15rem;margin-bottom:4px}
.tbl-wrap{overflow-x:auto;max-width:100%}
table.tbl{border-collapse:collapse;width:100%;font-size:1.05rem;background:#fff}
.tbl th,.tbl td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:middle}
.tbl th{background:var(--blue-ll);color:var(--title);font-weight:700}
.tbl td.num,.tbl th.num{text-align:right}
.scroll-box{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.scroll-box .tbl th{position:sticky;top:0;z-index:1}
.feedback{font-weight:700;margin-top:6px;min-height:1.5em}
.feedback.ok{color:var(--blue)}
.feedback.no{color:var(--warn)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--title);color:#fff;padding:10px 18px;border-radius:10px;z-index:300;font-size:1rem;max-width:calc(100vw - 32px);text-align:center}
body.flash::after{content:"";position:fixed;inset:0;background:var(--blue);pointer-events:none;z-index:250;animation:flash .45s ease-in-out 8 alternate}
@keyframes flash{from{opacity:0}to{opacity:.55}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* 홈 */
.hero{padding:28px 0 8px}
.hero h1{font-size:2rem}
.hero .sub{color:var(--text);font-size:1.1rem;margin-top:6px}
.journey{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px;margin:20px 0;position:relative}
.j-card{position:relative;display:flex;flex-direction:column;gap:8px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
.j-card:not(:last-child)::after{content:"";position:absolute;right:-15px;top:46px;width:12px;height:12px;border-top:3px solid var(--blue);border-right:3px solid var(--blue);transform:rotate(45deg)}
.j-card.done{border-color:var(--blue)}
.j-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.j-no{font-size:1.6rem;font-weight:800;color:var(--blue)}
.j-no small{font-size:1rem;font-weight:700;margin-left:2px}
.j-icon{width:44px;height:44px;border-radius:12px;background:var(--blue-ll);color:var(--blue);display:flex;align-items:center;justify-content:center}
.j-card h2{font-size:1.25rem}
.j-stage{font-size:1rem;color:var(--blue);font-weight:700}
.j-q{font-size:1rem;color:var(--text);flex:1}
.j-page{font-size:.9rem;color:var(--muted)}
.j-card .btn{width:100%}
@media (max-width:1100px){.journey{grid-template-columns:1fr}.j-card:not(:last-child)::after{right:auto;left:40px;top:auto;bottom:-15px;transform:rotate(135deg)}}
.core{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;margin:8px 0 28px;text-align:center}
.core .lbl{font-size:1rem;color:var(--blue);font-weight:800;letter-spacing:.02em}
.core p{font-size:1.75rem;font-weight:800;color:var(--title);margin:.3em 0 0;line-height:1.4}
.project-done{display:flex;align-items:center;gap:10px;justify-content:center;background:var(--blue);color:#fff;border-radius:12px;padding:12px;font-weight:800;margin-top:10px}

/* 차시 화면 */
.lesson{padding:10px 16px 28px}
.lesson-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:7px 10px}
.lh-no{flex:none;background:var(--blue);color:#fff;border-radius:10px;font-weight:800;padding:6px 12px;font-size:1.05rem}
.lh-title{flex:1 1 150px;min-width:0;font-size:1.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flow{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.flow-title{font-size:.9rem;font-weight:700;color:var(--title);margin-bottom:4px}
.flow-bar{display:flex;gap:3px;border-radius:8px;overflow:hidden}
.flow-seg{background:var(--blue-l);color:var(--title);font-size:.8rem;padding:4px 6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flow-seg:nth-child(odd){background:#C9D5EE}
.dots{display:flex;gap:6px;flex:0 1 auto;justify-content:center;flex-wrap:wrap}
.dot{min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--title);font-weight:700;cursor:pointer;padding:0 8px;font-size:.95rem}
.dot.cur{background:var(--blue);border-color:var(--blue);color:#fff}
.dot.seen{border-color:var(--blue);color:var(--blue)}
.pos{display:none;flex:1;text-align:center;font-weight:700;color:var(--title)}
@media (max-width:1100px){.dots{display:none}.pos{display:block}}
.lesson-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start;margin-top:10px}
@media (min-width:1100px){body.teacher .lesson-grid{grid-template-columns:minmax(0,1fr) 330px}}
.step{min-width:0}
.step-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{background:var(--blue-l);color:var(--blue);font-weight:800;border-radius:999px;padding:2px 12px;font-size:1rem}
.step h2{font-size:1.45rem}
.task{font-size:1.3rem;color:var(--title);font-weight:700;margin:6px 0 4px}
.book{display:flex;align-items:center;gap:6px;font-size:1rem;color:var(--blue);font-weight:600}
.tool{margin-top:8px}
.mission-goals{display:grid;gap:10px;margin:14px 0}
.goal{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.goal b{flex:none;background:var(--blue);color:#fff;border-radius:8px;padding:2px 10px;font-size:1rem;margin-top:2px}
.goal.ai b{background:#fff;color:var(--blue);border:1px solid var(--blue)}

/* 교사 카드 */
.tcard{background:#fff;border:2px solid var(--blue);border-radius:16px;padding:0;font-size:1rem}
.tcard summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;padding:12px 14px;font-weight:800;color:var(--blue);min-height:44px}
.tcard summary::-webkit-details-marker{display:none}
.tcard .tc-body{padding:0 14px 14px}
.tcard dl{margin:0}
.tcard dt{font-weight:800;color:var(--title);margin-top:10px;font-size:.95rem}
.tcard dd{margin:2px 0 0;line-height:1.5}
.tcard .ask{background:var(--blue-ll);border-radius:10px;padding:8px 10px;color:var(--title);font-weight:600}

/* 도구들 */
.chosung{font-size:1.4rem;color:var(--title);line-height:2.2}
.chosung .hint{display:inline-block;border:2px dashed var(--blue);color:var(--blue);border-radius:8px;padding:0 10px;font-weight:800;margin:0 4px}
.role-card{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;display:flex;flex-direction:column;gap:6px}
.role-card .r-ic{width:44px;height:44px;border-radius:12px;background:var(--blue-ll);color:var(--blue);display:flex;align-items:center;justify-content:center}
.role-card h3{font-size:1.25rem}
.goal-chip{display:inline-flex;align-items:center;gap:8px;background:var(--blue);color:#fff;border-radius:12px;padding:8px 14px;font-weight:800}
.qr-box{display:inline-block;padding:10px;background:#fff;border:1px solid var(--line);border-radius:12px}
.qr-box img,.qr-box canvas{display:block}
.def-card{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}
.def-card h3{font-size:1.4rem;color:var(--blue)}
.arrow-q{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0;background:#fff}
.arrow-q .node{font-weight:800;color:var(--title);background:var(--grey-l);border-radius:8px;padding:4px 10px}
.arrow-q .arr{color:var(--blue);display:inline-flex}
.ox{display:flex;gap:10px}
.ox button{min-width:72px;min-height:56px;font-size:1.6rem;font-weight:800;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--title);cursor:pointer}
.ox button.sel{border-color:var(--blue);background:var(--blue);color:#fff}
.tally{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.tally .t-row{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}
.tally .t-row h3{font-size:1.1rem}
.tally .t-ctl{display:flex;align-items:center;gap:6px;margin-top:6px}
.tally .t-ctl b{min-width:2ch;text-align:center;font-size:1.4rem;color:var(--title)}
.tally .t-ctl .lbl{width:1.5em;font-weight:800}
.chart-box{position:relative;height:260px;width:100%}
.chart-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.chart-row{grid-template-columns:1fr}}
.chart-title{font-size:1.05rem;font-weight:700;color:var(--title);margin-bottom:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.stat-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 14px;display:flex;align-items:baseline;gap:8px}
.stat b{font-size:1.8rem;color:var(--blue)}
.stat.arrow{border:0;background:none;padding:0;color:var(--blue)}
.word-cards{display:flex;flex-wrap:wrap;gap:10px}
.word{border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:150px;background:#fff;font-size:1.3rem;font-weight:800;color:var(--title)}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.subtab{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:700;color:var(--title);font-size:1.05rem}
.subtab.cur{background:var(--blue);color:#fff;border-color:var(--blue)}
.subtab.ok{border-color:var(--blue);color:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:48px}
.chip{min-height:44px;padding:4px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:700;color:var(--title);font-size:1.05rem}
.chip.sel{border:2px solid var(--blue);background:var(--blue-ll);color:var(--blue)}
.chip.in{background:var(--blue);color:#fff;border-color:var(--blue)}
.pool{border:2px dashed var(--line);border-radius:12px;padding:10px;background:#FAFBFD}
.buckets{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:8px}
.bucket{border:1px solid var(--line);border-radius:12px;padding:6px 8px;background:#fff;min-height:64px}
.bucket.over{border-color:var(--blue);background:var(--blue-ll)}
.bucket-head{display:flex;justify-content:space-between;gap:6px;align-items:center;margin-bottom:6px}
.bucket-head b{color:var(--title);font-size:1.15rem}
.flip-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;perspective:1000px}
@media (max-width:760px){.flip-grid{grid-template-columns:1fr}}
.flip{border:0;background:none;padding:0;cursor:pointer;display:grid;text-align:left;min-height:180px;transition:transform .5s;transform-style:preserve-3d;width:100%}
.flip.on{transform:rotateY(180deg)}
.flip .face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);border-radius:14px;padding:16px;background:#fff;display:flex;flex-direction:column;justify-content:center;gap:6px}
.flip .front{align-items:center;text-align:center}
.flip .front b{font-size:1.6rem;color:var(--blue)}
.flip .back{transform:rotateY(180deg);background:var(--blue-ll);color:var(--title);font-size:1.1rem}
.flow4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px;margin:8px 0}
.flow4 > div{position:relative;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;background:#fff;font-weight:700;color:var(--title);font-size:1.05rem}
.flow4 > div:not(:last-child)::after{content:"";position:absolute;right:-17px;top:50%;width:10px;height:10px;border-top:3px solid var(--blue);border-right:3px solid var(--blue);transform:translateY(-50%) rotate(45deg)}
@media (max-width:640px){.flow4{grid-template-columns:repeat(2,minmax(0,1fr))}.flow4 > div::after{display:none}}
.sort-pool{display:flex;flex-wrap:wrap;gap:8px;min-height:52px}
.sort-card{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff;color:var(--title);font-weight:700}
.sort-card .btn-row{margin:0}
.sort-bins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:10px}
@media (max-width:640px){.sort-bins{grid-template-columns:1fr}}
.sort-bin{border:2px solid var(--blue-l);border-radius:12px;padding:10px;min-height:110px;background:#FAFBFD}
.sort-bin h3{font-size:1.15rem;color:var(--blue);margin-bottom:6px}
.placed{display:inline-flex;align-items:center;gap:4px;margin:3px;padding:4px 12px;border-radius:999px;background:var(--blue);color:#fff;font-weight:700;font-size:1rem}
.bubble{position:relative;border:1px solid var(--line);border-radius:16px;padding:12px 16px;background:#fff;color:var(--title);font-weight:700}
.bubble .who{display:block;font-size:.9rem;color:var(--muted);font-weight:600;margin-bottom:4px}
.bubble.bias{border-color:var(--warn)}
.bubble.bias .tag{color:var(--warn)}
.bubble .tag{display:block;font-size:.95rem;margin-top:6px;color:var(--blue)}
.prod-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:1000px){.prod-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.prod-grid{grid-template-columns:1fr}}
.prod{border:2px solid var(--line);border-radius:12px;padding:10px;background:var(--grey-l);display:flex;flex-direction:column;gap:4px}
.prod.can{border-color:var(--ok);background:var(--ok-l)}
.prod h3{font-size:1.15rem;display:flex;justify-content:space-between;gap:4px}
.prod .rec{font-size:.92rem;color:var(--text)}
.prod .st{font-size:.95rem;font-weight:700}
.prod.can .st{color:var(--ok)}
.prod .st.no{color:var(--muted)}
.prod .cnt{font-size:1.4rem;font-weight:800;color:var(--title)}
.res-row{display:flex;flex-wrap:wrap;gap:8px}
.res{border:1px solid var(--line);border-radius:12px;padding:6px 14px;background:#fff;font-weight:700;color:var(--title)}
.res b{font-size:1.4rem;color:var(--blue);margin-left:6px}
.res.zero b{color:var(--warn)}
.lockbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:#fff;margin-top:10px}
.lockbar.locked{border-color:var(--blue);background:var(--blue-ll)}
.score-card{border:2px solid var(--blue);border-radius:14px;padding:14px;background:#fff}
.score-card table{margin-top:6px}
.plane-wrap{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px}
.plane-wrap svg{width:100%;height:auto;display:block;max-height:150px}
.quiz-list{display:grid;gap:8px}
.quiz-list.cols{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));align-items:start}
.quiz-list.cols2{grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));align-items:start}
.tbl.compact th,.tbl.compact td{padding:4px 8px}
.qrow{border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.qrow .qt{flex:1 1 320px;color:var(--title);font-size:1.1rem}
.qrow.ok{border-color:var(--blue);background:var(--blue-ll)}
.qnum{font-weight:800;color:var(--blue);margin-right:4px}
.qnum.circle{display:inline-flex;width:1.6em;height:1.6em;border-radius:50%;background:var(--blue);color:#fff;align-items:center;justify-content:center;font-size:.85em;margin-right:6px;vertical-align:.1em}
.blank{display:inline-block;width:3.6em;border-bottom:2px solid var(--title);margin:0 3px;vertical-align:baseline}
.stars{display:flex;gap:6px;flex-wrap:wrap}
.star-btn{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--grey);font-size:.95rem}
.star-btn span{color:var(--title);font-weight:600}
.star-btn.sel{border-color:var(--blue);color:var(--blue);background:var(--blue-ll)}
.eval-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:8px 0}
.eval-row .et{flex:1 1 320px;color:var(--title)}
.eval-row .et b{color:var(--blue);margin-right:6px}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.steps3{grid-template-columns:1fr}}
.steps3 .mini b.n{display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;align-items:center;justify-content:center;margin-right:6px}
.chain{display:flex;flex-direction:column;gap:6px}
.chain div{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff;color:var(--title)}
.chain .down{border:0;background:none;padding:0;text-align:center;color:var(--blue)}
.check-list label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;color:var(--title);cursor:pointer}
.check-list input{width:24px;height:24px;flex:none;margin-top:3px;accent-color:var(--blue)}
.evi label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:5px 10px;margin:5px 0;cursor:pointer;background:#fff;font-size:1rem;min-height:44px}
.evi input{width:22px;height:22px;flex:none;margin-top:3px;accent-color:var(--blue)}
.prop-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.prop-grid{grid-template-columns:1fr}}
.prop-grid .mini textarea{min-height:58px}
.prop-col{display:grid;gap:10px;align-content:start}

/* 교사 도구 서랍 */
.fab{position:fixed;right:16px;bottom:16px;z-index:60;width:62px;height:62px;border-radius:50%;background:var(--blue);color:#fff;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.drawer{position:fixed;right:16px;bottom:90px;width:min(460px,calc(100vw - 32px));max-height:calc(100vh - 110px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px;z-index:61;padding:14px;box-shadow:0 4px 18px rgba(0,0,0,.12)}
.drawer h2{font-size:1.2rem;display:flex;justify-content:space-between;align-items:center}
.timer-num{font-size:5rem;font-weight:800;color:var(--title);text-align:center;font-variant-numeric:tabular-nums;line-height:1.1;margin:6px 0}
.timer-num.end{color:var(--warn)}
.draw-num{font-size:4rem;font-weight:800;color:var(--blue);text-align:center;line-height:1.2;min-height:1.2em}
.assign{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.assign div{border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:1rem}
.assign b{color:var(--blue)}

/* 모달 */
.modal-back{position:fixed;inset:0;background:rgba(20,30,50,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:22px;max-height:92vh;overflow:auto}
.modal.wide{max-width:min(92vw,900px);text-align:center}
.modal h2{font-size:1.35rem;margin-bottom:8px}
.pin-input{font-size:2rem!important;letter-spacing:.5em;text-align:center;width:8em}
.big-qr{display:flex;justify-content:center;margin:12px 0}
.big-qr img,.big-qr canvas{width:min(70vmin,560px)!important;height:auto!important;image-rendering:pixelated}

/* 설정 */
.settings{padding:20px 16px 40px}
.settings section{margin-bottom:16px}
.settings h2{font-size:1.3rem;margin-bottom:8px}
.link-field{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:8px;align-items:center;margin:8px 0}
.link-field input{width:100%}
@media (max-width:760px){.link-field{grid-template-columns:1fr}}
.foot{padding:20px 16px 90px;text-align:center;font-size:.9rem;color:var(--muted)}
@media print{.topbar,.fab,.drawer,.lesson-bar{display:none}}
</style>

  try { localStorage.setItem(P + 'test', '1'); localStorage.removeItem(P + 'test'); } catch (e) { ok = false; }
  function raw(k) {
    let v = null;
    try { v = localStorage.getItem(P + k); } catch (e) { v = null; }
    if (v == null && Object.prototype.hasOwnProperty.call(mem, P + k)) v = mem[P + k];
    return v;
  }
  return {
    ok,
    get(k, d) { const v = raw(k); if (v == null) return d; try { return JSON.parse(v); } catch (e) { return d; } },
    set(k, val) { const s = JSON.stringify(val); mem[P + k] = s; try { localStorage.setItem(P + k, s); } catch (e) { /* 저장 불가 환경 */ } },
    del(k) { delete mem[P + k]; try { localStorage.removeItem(P + k); } catch (e) { /* 무시 */ } },
    keys() {
      const out = new Set(Object.keys(mem).filter(k => k.startsWith(P)).map(k => k.slice(P.length)));
      try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(P)) out.add(k.slice(P.length)); } } catch (e) { /* 무시 */ }
      out.delete('test');
      return [...out];
    }
  };
})();

/* el: 그릴 상자, cfg: Chart.js 설정, fb: {head, rows} 표 대비 */
function drawChart(el, cfg, fb) {
  if (!el) return;
  if (typeof window.Chart !== 'function') {
    el.style.height = 'auto';
    el.innerHTML = '<p class="small">차트를 불러오지 못해 표로 보여 줘요.</p>' + tableHTML(fb.head, fb.rows);
    return;

  el.innerHTML = '<canvas></canvas>';
  const fsz = document.documentElement.classList.contains('present') ? 20 : 14;
  const base = {
    responsive: true, maintainAspectRatio: false, animation: { duration: 300 },
    plugins: { legend: { labels: { font: { size: fsz, family: getComputedStyle(document.body).fontFamily }, color: DARK } }, tooltip: { bodyFont: { size: fsz } } },
    scales: {}
  };
  cfg.options = deepMerge(base, cfg.options || {});
  const ax = cfg.options.scales;
  ['x', 'y'].forEach(k => { ax[k] = deepMerge({ ticks: { font: { size: fsz }, color: DARK }, grid: { color: '#E3E7EE' } }, ax[k] || {}); });
  charts.push(new window.Chart(el.querySelector('canvas'), cfg));
}
function deepMerge(a, b) {
  const out = Array.isArray(a) ? a.slice() : Object.assign({}, a);
  Object.keys(b).forEach(k => {
    if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && a[k] && typeof a[k] === 'object') out[k] = deepMerge(a[k], b[k]);
    else out[k] = b[k];
  });
  return out;
}

    options: {
      indexAxis: horizontal ? 'y' : 'x',
      plugins: { legend: { display: false } },
      scales: horizontal ? { x: { beginAtZero: true, ticks: { precision: 0 } } } : { y: { beginAtZero: true, ticks: { precision: 0 } } }

function teacherCardHTML(t, L) {
  if (!t) return '';
  const key = resolveDyn(t.key);
  const extra = (t.extra || []).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('');
  return `<details class="tcard" open><summary>${icon('key', 18)} 교사 카드 · ${esc(t.time || '')}</summary><div class="tc-body"><dl>
    <dt>교사 발문</dt><dd class="ask">${esc(t.ask)}</dd>
    <dt>예상 학생 답변</dt><dd>${esc(t.answer)}</dd>
    <dt>정답·예시 답</dt><dd>${key}</dd>
    <dt>운영 팁</dt><dd>${esc(t.tip || '')}</dd>
    <dt>예상 시간</dt><dd>${esc(t.time || '')}</dd>${extra}
  </dl></div></details>`;
}
function resolveDyn(key) {
  const m = /^\{(\w+)\}$/.exec(key || '');
  if (m && DYN[m[1]]) return DYN[m[1]]();
  return esc(key || '');
}

const QREG = {};
function matches(val, answers) { const v = norm(val); return v !== '' && answers.some(a => norm(a) === v); }
function quizHTML(q, key, num) {
  QREG[key] = q;
  const saved = Ans.get(key, '');
  const ok = Ans.get(key + '.ok', false);
  const head = `<p class="qt">${num ? `<span class="qnum">Q${num}</span>` : ''}${qtext(q.q)}</p>`;
  if (q.type === 'fill') {
    return `<div class="mini" data-q="${key}">${head}
      <div class="btn-row"><input type="text" class="fill" data-qin="${key}" value="${esc(saved)}" aria-label="빈칸 답" autocomplete="off"><button class="btn" data-act="qcheck" data-key="${key}">확인</button></div>
      <div class="feedback ${ok ? 'ok' : ''}" data-fb="${key}">${ok ? '맞았어요!' : ''}</div></div>`;
  }
  if (q.type === 'ox') {
    return `<div class="mini" data-q="${key}">${head}
      <div class="ox">${['O', 'X'].map(o => `<button class="${saved === o ? 'sel' : ''}" data-act="qox" data-key="${key}" data-v="${o}" aria-label="${o}">${o}</button>`).join('')}</div>
      <div class="feedback ${ok ? 'ok' : (saved ? 'no' : '')}" data-fb="${key}">${ok ? ('맞았어요!' + (q.explain ? ' ' + esc(q.explain) : '')) : (saved ? '다시 생각해 봐요.' : '')}</div></div>`;
  }
  /* think: 채점 없음 */
  const ox = Ans.get(key + '.ox', '');
  return `<div class="mini" data-q="${key}">${head}<p class="small">생각 문제 · 채점하지 않아요</p>
    ${q.withOX ? `<div class="ox" style="margin:6px 0">${['O', 'X'].map(o => `<button class="${ox === o ? 'sel' : ''}" data-act="thinkox" data-key="${key}" data-v="${o}">${o}</button>`).join('')}</div>` : ''}

    <div class="btn-row"><button class="btn ghost sm" data-act="copyThink" data-key="${key}">${icon('copy', 18)} 복사하기</button></div></div>`;
}

function doBackup() {
  const data = {};
  Store.keys().forEach(k => { data[k] = Store.get(k, null); });
  copyText(JSON.stringify({ app: C.app.title, savedAt: new Date().toISOString(), data }));
}
function restoreFrom(text) {
  try {
    const obj = JSON.parse(text);
    if (!obj || typeof obj.data !== 'object') throw new Error('형식');
    ask('지금 기기의 데이터를 백업 내용으로 바꿀까요?', () => { Object.keys(obj.data).forEach(k => Store.set(k, obj.data[k])); toast('복원했어요.'); render(); });
  } catch (e) { toast('백업 내용을 읽을 수 없어요.'); }
}
function doRestore(file) {
  const r = new FileReader();
  r.onload = () => restoreFrom(r.result);
  r.readAsText(file);
}

/* ---------- 교사 도구 서랍 ---------- */
const Timer = {
  total: 300, left: 300, running: false, iv: null, sound: false, ended: false,
  set(min) { this.pause(); this.total = clamp(min, 1, 20) * 60; this.left = this.total; this.ended = false; this.paint(); },
  start() {
    if (this.running) return;
    if (this.left <= 0) { this.left = this.total; this.ended = false; }
    this.running = true;
    this.iv = setInterval(() => {
      this.left -= 1;
      if (this.left <= 0) { this.left = 0; this.pause(); this.ended = true; this.end(); }
      this.paint();
    }, 1000);
    this.paint();
  },
  pause() { this.running = false; clearInterval(this.iv); this.iv = null; this.paint(); },
  reset() { this.pause(); this.left = this.total; this.ended = false; this.paint(); },
  text() { const m = Math.floor(this.left / 60), s = this.left % 60; return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`; },
  end() {
    document.body.classList.remove('flash'); void document.body.offsetWidth; document.body.classList.add('flash');
    setTimeout(() => document.body.classList.remove('flash'), 3800);
    if (this.sound) beep();
    toast('시간이 끝났어요!');
  },
  paint() {
    $$('[data-timer-text]').forEach(el => { el.textContent = this.text(); el.classList.toggle('end', this.ended); });
    $$('[data-timer-min]').forEach(el => { el.textContent = Math.round(this.total / 60); });
    $$('[data-act="tStart"]').forEach(b => { b.innerHTML = this.running ? `${icon('pause')} 멈춤` : `${icon('play')} 시작`; });
  }
};
function beep() {
  try {
    const A = window.AudioContext || window.webkitAudioContext; if (!A) return;
    const ctx = new A();
    [0, 0.35, 0.7].forEach(t => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 880; g.gain.value = 0.15; o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.2); });
  } catch (e) { /* 소리 없이 */ }
}
function timerHTML() {
  return `<div class="timer-num ${Timer.ended ? 'end' : ''}" data-timer-text aria-live="polite">${Timer.text()}</div>
    <div class="btn-row" style="justify-content:center">

  }
  if (state.drawerTab === 'qr') {
    const filled = C.links.filter(l => link(l.key));
    const sel = Store.get('qrSel', filled[0] ? filled[0].key : '');
    body = filled.length ? `<label class="field">띄울 링크<select id="qrSel">${filled.map(l => `<option value="${l.key}" ${l.key === sel ? 'selected' : ''}>${esc(l.label)}</option>`).join('')}</select></label>
      <div class="btn-row"><button class="btn" data-act="bigQR">${icon('expand')} 크게 띄우기</button></div>
      <div class="qr-box" id="drawerQR"></div>` : `<p class="note">설정에 넣은 링크가 없어요. 설정에서 링크를 먼저 넣어 주세요.</p>`;
  }
  root.innerHTML = `<button class="fab" data-act="drawer" aria-label="교사 도구 서랍" aria-expanded="${state.drawer}">${icon(state.drawer ? 'x' : 'tools', 28)}</button>
    ${state.drawer ? `<div class="drawer" role="dialog" aria-label="교사 도구"><h2>교사 도구 <button class="tb-btn" data-act="drawer" aria-label="닫기">${icon('x', 18)}</button></h2>
      <div class="subtabs" style="margin-top:8px">${tabs.map(([k, n, ic]) => `<button class="subtab ${state.drawerTab === k ? 'cur' : ''}" data-act="dtab" data-k="${k}">${icon(ic, 18)} ${n}</button>`).join('')}</div>
      ${body}</div>` : ''}`;
  if (state.drawer && state.drawerTab === 'qr') {
    const sel = $('#qrSel'); if (sel) makeQR($('#drawerQR'), link(sel.value), 200);
  }
}
function drawCountries() {
  const n = settings().groups;
  const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
  let list = [];
  while (list.length < n) list = list.concat(shuffle(C.countries));
  list = shuffle(list.slice(0, n));
  const out = {}; list.forEach((c, i) => { out[i + 1] = c; });
  Store.set('countryDraw', out);
  return out;
}

/* ---------- 이벤트(한곳에서 처리) ---------- */
const ACT = {
  home() { go('#home'); },
  open(el) { go(`#l${el.dataset.id}-0`); },
  present() { document.documentElement.classList.toggle('present'); renderTop(); refresh(); },
  settings() { go('#setup'); },
  teacher() {
    if (state.teacher) { setTeacher(false); toast('교사 모드를 껐어요.'); return; }
    openModal(`<h2>교사 모드</h2><p class="note">4자리 숫자를 입력하세요.</p>
      <form id="pinForm"><input type="password" inputmode="numeric" maxlength="4" id="pinIn" class="pin-input" autocomplete="off" aria-label="4자리 숫자">
      <div class="feedback no" id="pinMsg"></div>
      <div class="btn-row"><button class="btn" type="submit">켜기</button><button class="btn plain" type="button" data-act="modalClose">취소</button></div></form>`);
    $('#pinIn').focus();
  },
  modalBack(el, e) { if (e.target === el) closeModal(); },
  modalClose() { closeModal(); },
  askYes() { const f = askYes; askYes = null; closeModal(); if (f) f(); },
  prev() { if (state.page > 0) go(`#l${state.lesson}-${state.page - 1}`); },
  nextPage() { const n = pagesOf(LS(state.lesson)).length; if (state.page < n - 1) go(`#l${state.lesson}-${state.page + 1}`); },
  page(el) { go(`#l${state.lesson}-${el.dataset.i}`); },
  finish() {
    const done = Store.get('done', {}) || {}; done[state.lesson] = true; Store.set('done', done);
    toast(`${state.lesson}차시를 마쳤어요!`); go('#home');
  },
  /* 문제 */
  qcheck(el) {
    const key = el.dataset.key, q = QREG[key]; if (!q) return;
    const inp = $(`[data-qin="${key}"]`); const v = inp ? inp.value : '';
    Ans.set(key, v);
    const ok = matches(v, q.answers); Ans.set(key + '.ok', ok);
    const fb = $(`[data-fb="${key}"]`);
    fb.className = 'feedback ' + (ok ? 'ok' : 'no');
    fb.textContent = ok ? '맞았어요!' : (norm(v) ? '다시 생각해 봐요.' : '답을 먼저 써 보세요.');
    if (!ok && inp) { inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); }
  },
  qox(el) {
    const key = el.dataset.key, q = QREG[key]; if (!q) return;
    Ans.set(key, el.dataset.v); Ans.set(key + '.ok', el.dataset.v === q.answer);
    refresh();
  },
  thinkox(el) { Ans.set(el.dataset.key + '.ox', el.dataset.v); refresh(); },
  copyThink(el) {
    const key = el.dataset.key, q = QREG[key];
    const ox = Ans.get(key + '.ox', ''); const t = Ans.get(key, '');
    copyText(`${q ? q.q : ''}\n${ox ? ox + ' / ' : ''}${t}`);
  },
  /* 설정 */
  savePin() {
    const v = ($('#newPin') || {}).value || '';
    if (!/^\d{4}$/.test(v)) { toast('숫자 4자리를 넣어 주세요.'); return; }
    saveSettings({ pin: v }); $('#newPin').value = ''; toast('교사 모드 숫자를 바꿨어요.');
  },
  backup() { doBackup(); },
  restorePaste() { restoreFrom(($('#restoreText') || {}).value || ''); },
  resetAll() {
    ask('이 기기의 모든 학급 데이터와 설정을 지울까요?', () => setTimeout(() => ask('정말 지울까요? 되돌릴 수 없어요. (먼저 백업을 권해요)', () => {
      Store.keys().forEach(k => Store.del(k)); toast('전체 초기화했어요.'); render();
    }, '모두 지우기'), 0));
  },
  /* 서랍 */
  drawer() { state.drawer = !state.drawer; renderDrawer(); },
  dtab(el) { state.drawerTab = el.dataset.k; renderDrawer(); },
  tPlus() { Timer.set(Math.round(Timer.total / 60) + 1); },
  tMinus() { Timer.set(Math.round(Timer.total / 60) - 1); },
  tStart() { if (Timer.running) Timer.pause(); else Timer.start(); },
  tReset() { Timer.reset(); },
  tSound(el) { Timer.sound = !Timer.sound; el.setAttribute('aria-pressed', Timer.sound); el.innerHTML = `${icon(Timer.sound ? 'volume' : 'mute')} 소리 ${Timer.sound ? '켬' : '끔'}`; },
  drawGroup() {
    const n = settings().groups; const el = $('#drawNum'); let k = 0;
    const iv = setInterval(() => {
      el.textContent = (1 + Math.floor(Math.random() * n)) + '모둠';
      if (++k >= 12) {
        clearInterval(iv);
        const r = 1 + Math.floor(Math.random() * n);
        const hist = Store.get('drawHist', []) || []; hist.push(r); Store.set('drawHist', hist.slice(-30));
        renderDrawer();
      }
    }, 70);

function class12() { return Store.get('class12', []) || []; }
function src13() {
  const cls = class12();
  if (cls.length) return { rows: cls.map(r => ({ item: r.item, kind: r.kind, origin: r.origin || '', group: r.group })), example: false };
  return { rows: D.example13.map(r => ({ item: r[0], kind: r[1], origin: r[2], group: r[3] })), example: true };
}
function countBy(list) { const m = new Map(); list.forEach(v => m.set(v, (m.get(v) || 0) + 1)); return [...m.entries()].sort((a, b) => b[1] - a[1]); }
const blankLbl = v => (String(v || '').trim() === '' ? '(빈칸)' : String(v).trim());
function hashStr(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return String(h); }
function st13() {
  const src = src13();
  const sig = hashStr(JSON.stringify(src.rows)) + (src.example ? 'e' : 'c');
  let s = Store.get('l13', null);
  if (!s || s.sig !== sig) {
    s = { sig, map: (s && s.map) || {}, filled: false, dedup: false, labels: {}, buckets: (s && s.buckets) || C.lessons[13].steps[1].data.buckets.slice() };
    Store.set('l13', s);
  }
  return s;
}
function save13(s) { Store.set('l13', s); }
function clean13() {
  const src = src13(), s = st13();
  const unknown = C.lessons[13].steps[1].data.unknown;
  const all = src.rows.map((r, id) => {
    const raw = String(r.origin || '').trim();
    let o = raw ? (s.map[raw] || raw) : (s.filled ? unknown : '');
    return { id, item: String(r.item || '').trim(), kind: String(r.kind || '').trim(), raw, origin: o, group: r.group };
  });
  const seenKey = new Set(), dups = [], kept = [];
  all.forEach(r => {
    const k = `${r.group}|${norm(r.item)}|${norm(r.origin)}`;
    if (seenKey.has(k)) dups.push(r); else { seenKey.add(k); kept.push(r); }
  });
  const rows = s.dedup ? kept : all;
  return {
    src, s, all, rows, dups: s.dedup ? [] : dups,
    blanks: all.filter(r => !r.raw).length,
    before: countBy(src.rows.map(r => blankLbl(r.origin))),
    after: countBy(rows.map(r => blankLbl(r.origin)))
  };
}
/* 13차시 정리 데이터 1위 나라(없으면 null) */
function top13() {

  return list.length ? { name: list[0][0], n: list[0][1], example: c.src.example } : null;
}
function class15() { return (Store.get('class15', []) || []).filter(r => r && r.g); }

function score15(counts) {
  const vals = D.products.map(p => Math.max(0, parseInt(counts[p.name], 10) || 0));
  const total = vals.reduce((a, b) => a + b, 0), kinds = vals.filter(v => v > 0).length, bonus = D.bonus[kinds] || 0;
  return { total, kinds, bonus, score: total + bonus };
}
function linreg(from, to) {
  const ys = []; for (let y = from; y <= to; y++) ys.push(D.exports[y]);
  const n = ys.length, mx = (n - 1) / 2, my = ys.reduce((a, b) => a + b, 0) / n;
  let sxy = 0, sxx = 0; ys.forEach((y, i) => { sxy += (i - mx) * (y - my); sxx += (i - mx) * (i - mx); });
  const slope = sxy / sxx, icpt = my - slope * mx;
  const raw = year => icpt + slope * (year - from);
  return { raw, round: year => Math.round(Number(raw(year).toFixed(1))) };
}

function rules13() {
  const c = clean13(), labels = C.lessons[13].steps[3].data.labels.map(l => l.name);
  const kinds = [...new Set(D.kinds.concat(c.rows.map(r => r.kind).filter(Boolean)))];
  return kinds.map(k => {
    const lab = c.rows.filter(r => r.kind === k && c.s.labels[r.id]).map(r => c.s.labels[r.id]);
    if (!lab.length) return { kind: k, n: 0 };
    const cnt = countBy(lab).sort((a, b) => b[1] - a[1] || labels.indexOf(a[0]) - labels.indexOf(b[0]));
    return { kind: k, n: lab.length, top: cnt[0][0], m: cnt[0][1], tie: cnt.length > 1 && cnt[1][1] === cnt[0][1] };
  });
}

function predChart(el, from, to, last, showAI, showReal, mine) {
  const years = []; for (let y = from; y <= last; y++) years.push(y);
  const reg = linreg(from, to);
  const actual = years.map(y => (y <= to || showReal) ? D.exports[y] : null);
  const ai = years.map(y => showAI ? (y <= to ? Number(reg.raw(y).toFixed(1)) : reg.round(y)) : null);
  const my = years.map(y => (mine && Number.isFinite(mine[y])) ? mine[y] : null);
  const ds = [{ label: '실제 수출액', data: actual, borderColor: BLUE, backgroundColor: BLUE, borderWidth: 3, pointRadius: 4, tension: 0 }];
  if (showAI) ds.push({ label: 'AI 예측(직선)', data: ai, borderColor: '#8A93A3', backgroundColor: '#8A93A3', borderDash: [7, 5], borderWidth: 2, pointRadius: 3, tension: 0 });
  if (mine && my.some(v => v != null)) ds.push({ label: '내 예측', data: my, borderColor: DARK, backgroundColor: '#fff', showLine: false, pointStyle: 'rectRot', pointRadius: 8, borderWidth: 2 });
  drawChart(el, { type: 'line', data: { labels: years.map(String), datasets: ds }, options: { scales: { y: { suggestedMin: 4500, suggestedMax: 7500, title: { display: true, text: '억 달러' } } } } },
    { head: ['연도', '실제', 'AI 예측', '내 예측'], rows: years.map((y, i) => [String(y), actual[i], ai[i], my[i]]) });
}

  if (!r) { const draw = Store.get('countryDraw', null) || {}; r = { g, country: draw[g] || '', before: null, after: null, hard: '' }; saved.push(r); }
  const f = t.dataset.f;
  if (f === 'before' || f === 'after') { const n = parseInt(t.value, 10); r[f] = Number.isFinite(n) ? n : null; } else r[f] = t.value;
  saved.sort((a, b) => a.g - b.g); Store.set('class15', saved);
};
Object.assign(ACT, {
  r15Tab(el) { ui15 = el.dataset.k; refresh(); },
  r15Paste() {
    const rows = parse15(($('#paste15') || {}).value);
    if (!rows.length) { toast('읽을 수 있는 줄이 없어요. 칸 순서를 확인해 주세요.'); return; }
    const saved = class15();
    rows.forEach(n => { const i = saved.findIndex(x => x.g === n.g); if (i >= 0) saved[i] = n; else saved.push(n); });
    saved.sort((a, b) => a.g - b.g); Store.set('class15', saved); toast(`${rows.length}모둠 점수를 가져왔어요.`); refresh();
  },
  r15Clear() { ask('15차시 모둠 점수를 모두 지울까요?', () => { Store.set('class15', []); refresh(); }); },
  r15hard(el) { Ans.set('15.rec.hard', el.dataset.v); refresh(); },
  r15copy() {
    const v = f => Ans.get('15.rec.' + f, '');
    copyText([`${v('group') || '?'}모둠`, v('country'), v('before'), v('after'), v('hard')].join('\t'));
  }
});

/* 16-4 항공기 퀴즈 */
const NUMS = ['①', '②', '③', '④', '⑤', '⑥'];
function planeSVG(items, okList) {
  const slots = items.map((it, i) => {
    const x = 180 + i * 78, ok = okList[i];
    return `<g><rect x="${x}" y="78" width="66" height="56" rx="6" fill="${ok ? BLUE : '#fff'}" stroke="${ok ? BLUE : GREY}" stroke-width="2" ${ok ? '' : 'stroke-dasharray="6 4"'}/>
      <text x="${x + 33}" y="102" text-anchor="middle" font-size="18" font-weight="800" fill="${ok ? '#fff' : GREY}">${NUMS[i]}</text>
      ${ok ? `<text x="${x + 33}" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">${esc(it.cargo)}</text>` : ''}</g>`;
  }).join('');
  return `<svg viewBox="0 0 760 200" role="img" aria-label="수출 항공기 화물칸">
    <path d="M60 106 Q60 66 130 64 L640 64 Q720 66 740 106 Q720 146 640 148 L130 148 Q60 146 60 106 Z" fill="#F2F5FB" stroke="${BLUE}" stroke-width="3"/>
    <path d="M90 64 L50 10 L110 10 L170 64 Z" fill="#F2F5FB" stroke="${BLUE}" stroke-width="3" stroke-linejoin="round"/>
    <path d="M330 148 L270 196 L360 196 L450 148 Z" fill="#F2F5FB" stroke="${BLUE}" stroke-width="3" stroke-linejoin="round"/>
    <path d="M690 80 Q722 90 728 106 L690 106 Z" fill="${BLUE}" opacity=".25"/>
    ${slots}
  </svg>`;
}
TOOLS.plane16 = {
  html(s, L) {
    const d = s.data;
    const okList = d.items.map((_, i) => Ans.get(`${L.no}.plane.${i}.ok`, false));
    return `<div class="plane-wrap">${planeSVG(d.items, okList)}<p class="small" style="text-align:center">실린 화물: ${okList.some(Boolean) ? d.items.map((it, i) => okList[i] ? `${NUMS[i]} ${esc(it.cargo)}` : '').filter(Boolean).join(' · ') : '아직 없어요'}</p></div>
      ${okList.every(Boolean) ? `<div class="callout"><b>${esc(d.done)}</b></div>` : ''}
      <div class="quiz-list cols2" style="margin-top:8px">${d.items.map((it, i) => {
        const key = `${L.no}.plane.${i}`; QREG[key] = { type: 'fill', answers: it.answers };

      }).join('')}</div>`;

};
ACT.planeCheck = el => {

/* 16-5 데이터 근거 은행 */
function bank16() {
  const top = top13(), rows = class15().filter(r => Number.isFinite(r.before) && Number.isFinite(r.after));
  let play = '';
  if (rows.length) {
    const up = rows.filter(r => r.after > r.before).length, mx = Math.max(...rows.map(r => r.after)), mn = Math.min(...rows.map(r => r.after));
    play = `무역 후 점수가 오른 모둠 ${up}개 / ${rows.length}개 · 무역 후 점수 최고 ${mx}점, 최저 ${mn}점(차이 ${mx - mn}점)`;
  }
  return C.lessons[16].bank.map(b => Object.assign({}, b, {
    html: b.text.replace('{top}', top ? `${esc(top.name)}(${top.n}개)${top.example ? ' ' + exampleBadge(true) : ''}` : '<span class="note">(빈칸)</span>')
      .replace('{play}', play ? esc(play) : '<span class="note">(15차시 학급 데이터 없음)</span>'),
    plain: b.text.replace('{top}', top ? `${top.name}(${top.n}개)` : '(빈칸)').replace('{play}', play || '(데이터 없음)')
  }));
}

      ${bank16().map(b => `<tr><td>${esc(b.lesson)}</td><td>${b.html}</td><td><span class="badge ${b.type === '실제 통계' ? 'blue' : ''}">${esc(b.type)}</span></td></tr>`).join('')}

  }
};

}
